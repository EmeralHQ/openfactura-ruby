name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Solo lectura del repo: la CI no escribe nada. Publicar es un acto explícito
# (tag + rake release), nunca un efecto de mergear.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # El gemspec promete required_ruby_version >= 3.3.0: todo el rango corre.
        # 3.1 y 3.2 salen porque están EOL; 3.5 es la última estable.
        ruby: [ "3.3", "3.4", "3.5" ]
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # Los specs :integration quedan fuera por defecto (spec_helper): pegan al
      # sandbox real y necesitan credenciales. La red va mockeada con WebMock.
      - run: bundle exec rspec

  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          # 3.3 es el piso del gem y el que exige rubocop-shopify: no lo bajes.
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rubocop --parallel

  build:
    name: Build gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # `spec.files` se arma con `git ls-files`: esto falla acá, no en el release.
      - run: bundle exec rake build
      # Fuera del repo y sin bundler: verifica que el .gem publicable se instala
      # y carga solo con sus runtime deps, sin las de desarrollo.
      - name: Verificar que el gem construido instala y carga (Ruby 3.3)
        run: bash script/smoke_installed_gem.sh
      # Repetido en 3.4 dentro del MISMO job para no renombrar el check "Build gem"
      # (el ruleset de main lo exige por nombre; una matriz lo partiría en dos).
      # 3.4 es donde importa: base64 dejó de ser default gem y pasó a bundled, así
      # que un require no declarado explota acá y no en 3.3.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: false
      - name: Verificar que el gem construido instala y carga (Ruby 3.4)
        run: bash script/smoke_installed_gem.sh
