# RuboCop configuration following Omakase Rails style.
# rubocop-rails-omakase ships only a config file, no loadable Ruby: `require` raises LoadError.
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  Exclude:
    - 'bin/**/*'
    - 'pkg/**/*'
    - 'vendor/**/*'
    - 'spec/spec_helper.rb'
    - 'lib/generators/**/*'
    - 'sig/**/*'

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - 'lib/generators/**/*'
