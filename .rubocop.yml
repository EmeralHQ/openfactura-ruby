# RuboCop configuration following the Shopify Ruby style guide.
# https://shopify.github.io/ruby-style-guide/
#
# rubocop-shopify's own rubocop.yml declares `plugins: - rubocop-shopify`, so
# inheriting it is enough — no `require`/`plugins` entry needed here.
inherit_gem:
  rubocop-shopify: rubocop.yml

AllCops:
  TargetRubyVersion: 3.3
  Exclude:
    - 'bin/**/*'
    - 'pkg/**/*'
    - 'vendor/**/*'
    - 'spec/spec_helper.rb'
    - 'lib/generators/**/*'
    - 'sig/**/*'

# Deliberate deviation: the guide leaves quoting to the author, but CLAUDE.md makes
# double quotes a project convention, so we keep enforcing it.
Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes
